<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="KBL Arcade"><meta name="theme-color" content="#0b0f1e">
<title>KBL 아케이드 매니저</title><style>
:root{--bg:#0c1020;--panel:#141a30;--panel2:#1c2442;--line:#2a3458;--tx:#e8ecf8;--mut:#93a0c4;--acc:#ff8a3c;--acc2:#f07a2a;--good:#3ddc84;--warn:#f5b942;--bad:#ef5350;--blue:#4aa3ff;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--panel2);color:var(--tx);font-weight:700;font-size:13px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.pri{background:var(--acc);color:#1a0d02}button.ghost{background:transparent;border:1px solid var(--line)}button.sm{padding:5px 10px;font-size:12px}

.app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;background:linear-gradient(90deg,#1a0f2e,#2a1530);border-bottom:1px solid var(--line)}
.top .logo{font-weight:900;color:var(--acc);font-size:16px;letter-spacing:.5px}.top .club{display:flex;align-items:center;gap:8px;font-weight:800}
.top .sp{flex:1}.chip{background:rgba(255,255,255,.07);padding:5px 11px;border-radius:20px;font-size:12px;color:var(--mut);white-space:nowrap}.chip b{color:var(--tx)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:3px}
.nav button{text-align:left;background:transparent;padding:10px 12px;font-size:14px;color:var(--mut)}.nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}

.main{padding:18px 22px;overflow:auto}

.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.form .W{background:#2bb673;color:#04140b}.form .L{background:#d64541;color:#fff}
.big{font-size:24px;font-weight:900}.kpi{display:flex;flex-direction:column;gap:2px}.kpi small{color:var(--mut);font-size:12px}

.lgtabs{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}.lgtabs button{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 12px;color:var(--mut)}.lgtabs button.on{border-color:var(--acc);color:var(--tx);background:var(--panel2)}
.ystrip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}.ystrip button{flex:none;padding:6px 10px;font-size:12px}.ystrip button.on{background:var(--acc);color:#1a0d02}

.clubs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:1000px;width:100%}

/* ===== 아케이드 ===== */

#arcv{display:block;width:min(100vw,960px,calc((100dvh - 250px)*1.6));aspect-ratio:320/200;background:#000;touch-action:none;image-rendering:pixelated}

.abtns .bD{width:64px;height:64px;right:10px;bottom:112px;border:4px solid transparent;background:radial-gradient(circle at 35% 30%,#d9b3ff,#6a2fb0) padding-box,conic-gradient(#ffe14a 0%,rgba(20,12,28,.85) 0%) border-box}
.abtns button.on{filter:brightness(1.35);transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
#armenu{position:absolute;inset:0;background:rgba(4,6,14,.88);z-index:5;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 12px 20px;display:none}
#armenu .box{max-width:720px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.subrow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;background:var(--panel2);margin-bottom:4px;font-size:13px;cursor:pointer}
.subrow.sel{outline:2px solid var(--gold)}.subrow .nm{flex:1;font-weight:700}

 .arctl{position:absolute;inset:0;width:auto;padding:0 calc(10px + env(safe-area-inset-right)) 14px calc(10px + env(safe-area-inset-left));align-items:flex-end;pointer-events:none}

}

 .main{padding:12px 10px 90px}.g2,.g3{grid-template-columns:1fr}.clubs{grid-template-columns:repeat(2,minmax(0,1fr))}

 .modal{align-items:flex-end}.modal>.box{width:100%;max-height:92dvh;border-radius:16px 16px 0 0}
 td,th{padding:5px 5px;font-size:12px}
}
#ar .arhint{color:#8d96b8;font-size:12px;padding:4px 10px 6px;text-align:center}@media (orientation:landscape) and (max-height:600px){#ar .arhint{display:none}}

/* ===== v3 모바일 조작 · 드래그 라인업 ===== */

.arctl{width:100%;max-width:760px;padding:4px 10px calc(10px + env(safe-area-inset-bottom));align-items:stretch;gap:10px}

.hc{position:relative;width:100%;max-width:440px;margin:0 auto 10px;aspect-ratio:1/.95;border-radius:14px;background:repeating-linear-gradient(90deg,#c78649 0 22px,#cf8f50 22px 44px);border:3px solid #fdfaf2;overflow:hidden}

.dsrc{opacity:.3}.doff{opacity:.4}

<script>

 ※ 능력치는 게임용 추정치이며 공식 기록이 아닙니다. 이적·은퇴 연도는 공개 보도를 바탕으로 단순화했고 실제와 다를 수 있습니다.
===================================================================== */

let DSEL=null;
function bindDnd(root,onDrop,rerender){root.querySelectorAll('[data-slot]').forEach(el=>{
 el.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();const sx=e.clientX,sy=e.clientY,pid=e.pointerId;let gh=null,over=null;try{el.setPointerCapture(pid)}catch(_){}
  const mv=ev=>{if(ev.pointerId!==pid)return;if(!gh&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){const r=el.getBoundingClientRect();gh=el.cloneNode(true);gh.classList.add('dghost');gh.style.width=r.width+'px';document.body.appendChild(gh);el.classList.add('dsrc');try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}}
   if(gh){gh.style.left=(ev.clientX-gh.offsetWidth/2)+'px';gh.style.top=(ev.clientY-gh.offsetHeight/2-14)+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY);const sl=t&&t.closest('[data-slot]');const nv=sl&&sl!==el&&root.contains(sl)?sl:null;if(over!==nv){over&&over.classList.remove('dover');over=nv;over&&over.classList.add('dover')}}};
  const up=ev=>{if(ev.pointerId!==pid)return;el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
   if(gh){gh.remove();el.classList.remove('dsrc');if(over){over.classList.remove('dover');DSEL=null;onDrop(el.dataset.slot,over.dataset.slot)}}
   else if(ev.type==='pointerup'){const k=el.dataset.slot;if(DSEL===null){DSEL=k;rerender()}else if(DSEL===k){DSEL=null;rerender()}else{const a=DSEL;DSEL=null;onDrop(a,k)}}};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})})}

 for(const e of[0,1]){const bx=e?CW:0,s=e?-1:1,hx=bx+s*1.575,th=Math.asin(6.6/6.75);const arc=[[bx,HY-6.6],[hx+s*Math.cos(th)*6.75,HY-6.6]];for(let k=0;k<=30;k++){const an=-th+2*th*k/30;arc.push([hx+s*Math.cos(an)*6.75,HY+Math.sin(an)*6.75])}arc.push([bx,HY+6.6]);poly(c,arc);c.stroke();
  poly(c,[[bx,HY-2.45],[bx+s*5.8,HY-2.45],[bx+s*5.8,HY+2.45],[bx,HY+2.45]]);c.stroke();poly(c,circ(bx+s*5.8,HY,1.8,-Math.PI/2,Math.PI/2).map(p=>[bx+s*5.8+(p[0]-(bx+s*5.8))*s,p[1]]));c.stroke();

 const pb=P2(bx-s*1.15,HY,0),pt=P2(bx-s*1.15,HY,3.55);c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(pb[0],pb[1]+1,10,3,0,0,7);c.fill();

/* --- 선수 --- */
function poseOf(a){const h=holder(),B=G.ball;
 if(a.shooting||(h===a&&a.jump))return[a.styp==='lay'||a.styp==='dunk'?'lay':'shoot',0];
 if(G.phase==='ft'&&G.ft&&G.ft.a===a)return[G.ft.st==='fly'?'shoot':'dribble',0];
 if(a.jump||a.z>.05)return['jump',0];
 if(G.passFrom===a&&G.t-G.passT<.22)return['pass',0];
 if(h===a)return['dribble',Math.floor(G.t*7)%2];
 const sp=Math.hypot(a.vx,a.vy);if(sp>.6)return['run',Math.floor(a.ph*1.1)%4];
 if(h&&h.ti!==a.ti&&dist(a,h)<2.6)return['defend',0];
 return['stand',0]}
function drawGuy(c,a){const[sx,sy]=P2(a.x,a.y,0),s=psc(a.y),k=1.32*s*cl(.86+(a.p.ht-180)*.008,.84,1.12);const zp=a.z*ZS*s;
 c.fillStyle='rgba(30,10,0,.32)';c.beginPath();c.ellipse(sx,sy,7.5*s,2.6*s,0,0,7);c.fill();
 if(a===G.ctl){c.strokeStyle='#ffe14a';c.lineWidth=1.2;c.beginPath();c.ellipse(sx,sy,9*s,3.4*s,0,0,7);c.stroke()}
 const[pose,fr]=poseOf(a);let f=a.face;const h=holder();if(pose==='defend'&&h)f=h.x>a.x?1:-1;
 const im=sprOf(a,pose,fr),w=SPW*k,hgt=SPH*k;c.save();c.translate(Math.round(sx),Math.round(sy-zp));if(f<0)c.scale(-1,1);c.drawImage(im,-11*k,-hgt+.5*k,w,hgt);c.restore();
 const top=sy-zp-hgt;
 if(a===G.ctl){c.fillStyle='#ffe14a';c.beginPath();c.moveTo(sx-3,top-1);c.lineTo(sx+3,top-1);c.lineTo(sx,top+2.5);c.fill();c.strokeStyle='#140c1c';c.lineWidth=.6;c.stroke()}
 if(AR.names===2||(AR.names===1&&(a===G.ctl||(h===a))))txt(c,a.p.n,sx,sy+5*s+1,4.6,a===G.ctl?'#ffe14a':a.ti===0?'#fff':'#ffc2c2');
 if(a===G.ctl&&a.shooting){const t=G.t-a.st0,fq=cl(t/.85,0,1),pk=a.pk/.85,x=sx+10*s,yy=top+2,hh=20;c.fillStyle='#140c1c';c.fillRect(x-1,yy-1,5,hh+2);c.fillStyle='#3a3048';c.fillRect(x,yy,3,hh);c.fillStyle='#3fd46a';c.fillRect(x,yy+hh*(1-pk)-2,3,4);c.fillStyle=a.skill==='off'?'#ff5ad0':'#ffe14a';c.fillRect(x,yy+hh*(1-fq),3,hh*fq)}
 if(a.skill&&a.skT>0){c.globalAlpha=.5+.3*Math.sin(G.t*20);c.strokeStyle=a.skill==='off'?'#ff5ad0':'#5ad8ff';c.lineWidth=1.5;c.beginPath();c.ellipse(sx,sy-zp-hgt*.5,9*s,hgt*.55,0,0,7);c.stroke();c.globalAlpha=1}}
function drawFan(c){const a=G.ctl,h=holder();if(!h||h.ti===0||G.phase!=='live')return;const d=dist(a,h);if(d>3.2)return;const an=Math.atan2(h.y-a.y,h.x-a.x),r=1.6,ok2=d<1.6;
 const pts=[[a.x,a.y]];for(let i=0;i<=10;i++){const t=an-.7+1.4*i/10;pts.push([a.x+Math.cos(t)*r,a.y+Math.sin(t)*r])}c.globalAlpha=ok2?.42:.22;c.fillStyle=ok2?'#ff9a3a':'#5ad8ff';poly(c,pts);c.closePath();c.fill();c.globalAlpha=1}
function drawBall(c){const B=G.ball;const[sx,sy]=P2(B.x,B.y,0),[bx_,by_]=P2(B.x,B.y,B.z),s=psc(B.y),r=3.1*s;c.fillStyle='rgba(30,10,0,.3)';c.beginPath();c.ellipse(sx,sy,r,r*.4,0,0,7);c.fill();
 c.fillStyle='#140c1c';c.beginPath();c.arc(bx_,by_,r+.7,0,7);c.fill();c.fillStyle='#f07418';c.beginPath();c.arc(bx_,by_,r,0,7);c.fill();c.fillStyle='#ffb070';c.fillRect(bx_-r*.55,by_-r*.6,r*.5,r*.4);c.strokeStyle='#5a2a08';c.lineWidth=.55;c.beginPath();c.moveTo(bx_-r,by_);c.lineTo(bx_+r,by_);c.moveTo(bx_,by_-r);c.lineTo(bx_,by_+r);c.stroke()}

function portrait(c,a,x,y,flip,col){c.fillStyle='#140c1c';c.fillRect(x-1,y-1,18,18);c.fillStyle=col;c.fillRect(x,y,16,16);const im=sprOf(a,'stand',0);c.save();c.imageSmoothingEnabled=false;if(flip){c.translate(x+16,y);c.scale(-1,1);c.drawImage(im,6,3,12,12,0,0,16,16)}else c.drawImage(im,6,3,12,12,x,y,16,16);c.restore();c.strokeStyle='#ffe14a';c.lineWidth=.8;c.strokeRect(x-.5,y-.5,17,17)}

 c.fillStyle='#2a2238';c.fillRect(LW-64,LH-7.5,46,4);c.fillStyle=gs>=100?(Math.sin(G.t*12)>0?'#ff5ad0':'#ffe14a'):'#c36cff';c.fillRect(LW-64,LH-7.5,46*gs/100,4);txt(c,gs>=100?'스킬 OK':'스킬',LW-16,LH-5.3,4.6,'#fff','left',1)}

function draw(){const c=G.ctx;c.setTransform(SCL,0,0,SCL,0,0);c.imageSmoothingEnabled=false;if(G.cheer>0)G.cheer-=1/60;if(G.net>0)G.net-=1/60;

 /* 버튼 */
